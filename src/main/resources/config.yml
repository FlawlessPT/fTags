# Intervalo (segundos) de atualização das tags automáticas (mínimo 5).
refresh-seconds: 60

# A ordem desta lista é a ordem de apresentação. Uma tag "unique" só tem um detentor.
# "auto: richest" atribui a tag ao jogador mais rico.
tags:
  - id: magnata
    text: "&6[Magnata]"
    unique: true
    auto: richest
    # Anúncio a todos quando o detentor muda ({jogador}, {tag}, {saldo}); sem a chave ou lista vazia = sem anúncio.
    announce:
      - ""
      - "&6&l★ NOVO MAGNATA ★"
      - "&e{jogador} &7é agora o jogador mais rico do servidor!"
      - "&7Saldo: &f{saldo}"
      - ""

messages:
  no-tag: "&cNão tens essa tag."
  unknown-tag: "&cTag desconhecida."
  unavailable: "&cSistema de tags indisponível."
  usage-general: "&eUso: /tags"
  usage-help: "&eUso: /tags help"
  help-header: "&6Comandos de admin:"
  players-only: "&cApenas jogadores."
  no-tags: "&7Não tens tags."
  menu-title: "Tags"
  glass-chat-visible: "&aChat: Visível"
  glass-chat-hidden: "&cChat: Oculto"
  glass-tab-visible: "&aTab: Visível"
  glass-tab-hidden: "&cTab: Oculto"
  usage-add: "&eUso: /tags add <jogador> <tag>"
  usage-remove: "&eUso: /tags remove <jogador> <tag>"
  unknown-player: "&cJogador desconhecido."
  already-has: "&c{jogador} já tem essa tag."
  not-owned: "&c{jogador} não tem essa tag."
  given: "&aTag {tag} &adada a {jogador}."
  taken: "&aTag {tag} &aremovida a {jogador}."
  received: "&aRecebeste a tag {tag}&a."
  error: "&cOcorreu um erro. Tenta mais tarde."
