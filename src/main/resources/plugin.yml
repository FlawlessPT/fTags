name: fTags
main: pt.flawless.ftags.FTags
version: 1.0
description: Tags de jogador
depend: [fAPI, fDatabase, fEconomy]
commands:
  tags:
    description: Abre o menu das tuas tags (admins - help, add, remove)
    usage: "/tags [help | add <jogador> <tag> | remove <jogador> <tag>]"
    aliases: [tag]
permissions:
  ftags.admin:
    description: Permite /tags add, /tags remove e /tags help
    default: false
